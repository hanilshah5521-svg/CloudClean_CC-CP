<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CloudClean — Google Drive Storage Optimization</title>
    <script>
      // Apply the saved theme before the first paint (same rule as src/context/theme.jsx).
      try {
        var mode = localStorage.getItem("cloudclean-theme");
        if (mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
